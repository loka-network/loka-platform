# Root configuration for the Loka monorepo.
# Each service is an independently installable package (see services/*/pyproject.toml);
# they are installed one by one with pip, which is enough at this size.

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ['\.venv', 'build']

# anthropic is an optional extra (grounding[llm]); don't fail the strict typecheck when
# it isn't installed in the dev environment.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
