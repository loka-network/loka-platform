# supply-v2 — a relational ontology, exercising the parts of Ω a single-table domain cannot.
#
# health-v1 declares one entity and no relations, so R, ⪯ and C sit unused. Here all six parts of
# Ω = (E, A, R, ⪯, C, Actions) carry weight:
#   R  — four relations, each declaring the field it is traversed by (`via`)
#   ⪯  — BulkyProduct ⪯ Product, which decides whether an action is even applicable
#   C  — typing constraints on which entity types a verb may act on
#   Actions — guards that make eligibility a property of the ontology, not of application code
#
# OrderItem is a real entity, not a convenience: in the source data an order can hold several
# items (about 10% do) and one product may be sold by several sellers (about 4% are), so the
# seller belongs to the order line rather than to the product. Modelling the junction keeps the
# declared cardinalities true of the data, and makes Order -> Seller a genuine three-hop route.
version: supply-v2

entities:
  - type: Seller
    properties:
      - {name: seller_id,    type: string, required: true, description: "identity key"}
      - {name: seller_state, type: string, description: "two-letter Brazilian state code"}
      - {name: on_time_rate, type: double, description: "share of this seller's delivered orders that arrived by the promised date, 0-1"}

  - type: Product
    properties:
      - {name: product_id,  type: string, required: true, description: "identity key"}
      - {name: weight_g,    type: double, description: "shipping weight in grams"}
      - {name: volume_cm3,  type: double, description: "length x height x width, in cubic centimetres"}
      - {name: category,    type: string, description: "product category label"}

  # A subtype whose only job is to change what is permitted: an over-spec item cannot ship on the
  # standard service. Eligibility follows from ⪯ plus the action's guard, not from code.
  - type: BulkyProduct
    subtype_of: Product
    properties:
      - {name: weight_g, type: double, description: "shipping weight in grams; above the standard-service limit declared by the ShipStandard guard"}

  - type: OrderItem
    properties:
      - {name: item_id,       type: string, required: true, description: "identity key (order_id + line number)"}
      - {name: order_id,      type: string, description: "link to Order (traversed by relation contains)"}
      - {name: product_id,    type: string, description: "link to Product (traversed by relation of_product)"}
      - {name: seller_id,     type: string, description: "link to Seller (traversed by relation fulfilled_by)"}
      - {name: freight_value, type: double, description: "freight charged on this line, in BRL"}
      - {name: price,         type: double, description: "item price, in BRL"}

  - type: Order
    properties:
      - {name: order_id,    type: string, required: true, description: "identity key"}
      - {name: customer_id, type: string, description: "link to Customer (traversed by relation placed_by)"}
      - {name: days_late,   type: double, description: "delivered date minus promised date, in days; negative is early"}
      - {name: status,      type: string, description: "order status as recorded by the marketplace"}

  - type: Customer
    properties:
      - {name: customer_id,    type: string, required: true, description: "identity key"}
      - {name: customer_state, type: string, description: "two-letter Brazilian state code"}

# Each relation declares the field it is walked by, so a derived route is traversable without any
# naming convention in application code.
relations:
  - {name: contains,     from: Order,     to: OrderItem, via: order_id,    cardinality: one_to_many}
  - {name: of_product,   from: OrderItem, to: Product,   via: product_id,  cardinality: many_to_one}
  - {name: fulfilled_by, from: OrderItem, to: Seller,    via: seller_id,   cardinality: many_to_one}
  - {name: placed_by,    from: Order,     to: Customer,  via: customer_id, cardinality: many_to_one}

verbs:
  - {name: SHIP_STANDARD,  class: factual}
  - {name: NOTIFY_DELAY,   class: communicative}
  - {name: SUSPEND_SELLER, class: institutional}

# C: which entity types a verb may act on at all.
constraints:
  - {verb: SHIP_STANDARD,  agent_must_be: Seller, target_must_be: [Product]}
  - {verb: NOTIFY_DELAY,   agent_must_be: Seller, target_must_be: [Customer]}
  - {verb: SUSPEND_SELLER, agent_must_be: Seller, target_must_be: [Seller]}

actions:
  - name: ShipStandard
    verb: SHIP_STANDARD
    target: Product
    guard: "weight_g <= 10000"
    effect: "the product is dispatched on the standard service"

  - name: NotifyDelay
    verb: NOTIFY_DELAY
    target: Customer
    guard: "delay_days >= 1"
    effect: "the customer is told the order is late and given a revised date"

  - name: SuspendSeller
    verb: SUSPEND_SELLER
    target: Seller
    guard: "on_time_rate < 0.8"
    effect: "the seller is suspended from the marketplace pending review"

  # Au: the environment's half of A. Carriers strike; nobody here decides it. It is declared so
  # its effect can be reasoned about, and it can never be proposed or governed by a norm.
  - name: CarrierStrike
    verb: SHIP_STANDARD
    target: Product
    controllable: false
    effect: "the carrier stops accepting shipments in the affected region"

# N: N(s, ac) -> permitted | mandatory | forbidden. Distinct from a guard, which says whether an
# action *can* run. These say whether it *may*, *must*, or *must not*.
norms:
  - name: LateOrdersMustBeDisclosed
    action: NotifyDelay
    status: mandatory
    when: "delay_days >= 3"
    rationale: >
      Consumer law obliges the marketplace to disclose a material delay. Without a mandatory
      status the system could only record that notifying is allowed — it could never report that
      staying silent is a violation, which is the case that matters.

  - name: NoSuspensionWhileDisputed
    action: SuspendSeller
    status: forbidden
    when: "open_disputes >= 1"
    rationale: >
      A seller contesting the metric may not be suspended on that metric before the dispute is
      heard. This is not a precondition of suspending — suspension would work fine — it is a
      rule about what is allowed, so it belongs in N, not in the guard.
