[project]
name = "loka-ontology"
version = "0.0.1"
description = "Ontology engine Ω (E, V, R, ⪯, CΩ)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Bottom-up concept discovery: spaCy for noun phrases, sentence-transformers for embeddings,
# scikit-learn for affinity propagation. Heavy, and needed by one paradigm out of five, so the
# package works without them and that paradigm is simply not offered.
discovery = ["spacy>=3.7", "sentence-transformers>=2.7", "scikit-learn>=1.4"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "ruff>=0.5",
    # type-only + test-only: infer_from_adapter checks against the adapter contract;
    # the ontology package keeps no loka-schemas dependency at runtime.
    "loka-schemas",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loka_ontology*"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
