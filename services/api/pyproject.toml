[project]
name = "loka-api"
version = "0.0.1"
description = "Loka Platform HTTP API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "loka-schemas",
    "loka-ontology",
    "loka-state",
    "loka-causal",
    "loka-compiler",
    "loka-grounding",
    "loka-serving",
    # Kt: evidence synthesis behind causal ingest. Required, not optional — ingesting a
    # causal claim pools its evidence, so /kb/{id}/ingest imports it on the normal path.
    "loka-knowledge",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Only reached when LOKA_PG_DSN + NEO4J_URI are set; the in-memory backend needs neither.
postgres = ["loka-adapters"]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27", "loka-adapters"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loka_api*"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
