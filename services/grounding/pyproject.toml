[project]
name = "loka-grounding"
version = "0.0.1"
description = "Grounding G1 — natural language question -> typed query q* (propose + validate)"
requires-python = ">=3.11"
dependencies = ["loka-schemas"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loka_grounding*"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
